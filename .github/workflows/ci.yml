name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore DevOpsUP.slnx

      - name: Check formatting
        run: dotnet format DevOpsUP.slnx --verify-no-changes

      - name: Build solution
        run: dotnet build DevOpsUP.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test DevOpsUP.slnx --configuration Release --no-build --verbosity normal